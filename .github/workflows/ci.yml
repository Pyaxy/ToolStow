# 1. 工作流名称（会显示在 GitHub 仓库的 Actions 标签页里）
name: CI

# 2. 触发条件：向 main 分支 push，或者针对 main 发起 Pull Request 时触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 3. 最小权限：CI 只需要只读仓库代码
permissions:
  contents: read

# 4. 并发控制：同一个分支连续快速 push 时，自动取消上一次还没跑完的旧任务，省时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 5. 具体要执行的任务
jobs:
  check:
    name: Test & Clippy
    runs-on: ubuntu-24.04

    steps:
      # 步骤 1：拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v6

      # 步骤 2：安装最新稳定版 Rust 工具链（Edition 2024），并附带 clippy 组件
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 步骤 3：缓存 Cargo 依赖和 target 编译产物
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # 步骤 4：严格按 Cargo.lock 跑所有单元测试 + 集成测试
      - name: Run tests
        run: cargo test --locked

      # 步骤 5：跑 Clippy 静态检查，把任何 warning 当作错误拦截
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # 步骤 6：检查内置前端 JS 与全部 Skill/打包 Python 脚本语法
      - name: Check built-in JS and Python scripts
        run: |
          node --version
          for f in frontend/app.js admin/admin.js ui/v1/theme.js ui/v1/host.js scripts/verify_theme_mobile.cjs; do
            node --check "$f"
          done
          python3 -m py_compile skills/toolstow-tool/scripts/*.py skills/toolstow-theme/scripts/*.py scripts/bundle_examples.py

      # 步骤 7：与 Release 共用同一打包入口，自动发现并校验/打包全部示例主题与工具合集
      - name: Validate and bundle example tools and themes
        run: python3 scripts/bundle_examples.py --require-node --out-dir /tmp/toolstow-ci-bundles

      # 步骤 8：校验 Docker Compose 配置语法
      - name: Validate Docker Compose config
        run: docker compose -f compose.yml config --quiet

  browser-themes:
    name: Mobile Theme Browser Regression
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build debug binary
        run: cargo build --locked

      - name: Install Playwright Core
        run: |
          mkdir -p /tmp/pw
          npm --prefix /tmp/pw install --no-save playwright-core

      - name: Ensure Chromium/Chrome browser
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1; then
            echo "Using preinstalled Google Chrome"
          else
            /tmp/pw/node_modules/.bin/playwright-core install chromium
          fi

      - name: Verify mobile & landscape theme layouts
        run: |
          NODE_PATH=/tmp/pw/node_modules node scripts/verify_theme_mobile.cjs --self-test
          NODE_PATH=/tmp/pw/node_modules node scripts/verify_theme_mobile.cjs --binary target/debug/toolstow
