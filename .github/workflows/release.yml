name: Release

# 1. 只在推送 v 开头的版本 Tag 时触发（例如 v0.3.0 或 v0.4.0-rc.1）
on:
  push:
    tags:
      - "v*"

# 2. 最小权限：全局只读，仅在最终发布 Release 的 job 上开启 contents: write
permissions:
  contents: read

jobs:
  # =========================================================
  # 任务 0：发版前校验（校验 Tag 格式且必须与 Cargo.toml 版本号一致）
  # =========================================================
  preflight:
    name: Verify Tag & Version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check tag matches Cargo.toml version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          if not re.match(r"^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$", tag):
              print(f"ERROR: invalid release tag '{tag}' (expected vX.Y.Z or vX.Y.Z-pre)", file=sys.stderr)
              sys.exit(1)

          cargo_toml = Path("Cargo.toml").read_text(encoding="utf-8")
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', cargo_toml)
          if not m:
              print("ERROR: could not find package version in Cargo.toml", file=sys.stderr)
              sys.exit(1)

          cargo_ver = m.group(1)
          tag_ver = tag[1:]
          if tag_ver != cargo_ver:
              print(
                  f"ERROR: git tag '{tag}' (version '{tag_ver}') does not match "
                  f"Cargo.toml version '{cargo_ver}'",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"OK: tag '{tag}' matches Cargo.toml version '{cargo_ver}'")
          PY

  # =========================================================
  # 任务 1：多平台矩阵并行编译 Rust 单二进制 + 解压冒烟验收
  # =========================================================
  build-binaries:
    name: Build (${{ matrix.name }})
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            install_musl: true

          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            install_musl: true
            linker_env: musl-gcc

          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            install_musl: false

          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            install_musl: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install musl tools
        if: matrix.install_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker_env }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Linux / macOS 打包成 .tar.gz
      - name: Package binary archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/toolstow" staging/
          cp README.md LICENSE .env.example staging/
          tar -czf "dist/toolstow-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C staging .

      # Linux / macOS：在干净空临时目录解压并验证 --version 与单二进制内嵌前端
      - name: Smoke-test unpacked binary (Unix)
        if: runner.os != 'Windows'
        env:
          ARCHIVE: dist/toolstow-${{ github.ref_name }}-${{ matrix.name }}.tar.gz
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_ver="${TAG_NAME#v}"
          smoke_dir="$(mktemp -d)"
          pid=""
          cleanup() {
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT

          tar -xzf "$ARCHIVE" -C "$smoke_dir"
          ver_out="$("$smoke_dir/toolstow" --version)"
          echo "Binary version: $ver_out"
          [[ "$ver_out" == *"$expected_ver"* ]]

          (cd "$smoke_dir" && ./toolstow --host 127.0.0.1 --port 18080 --data-dir "$smoke_dir/data" >"$smoke_dir/server.log" 2>&1) &
          pid=$!

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "ERROR: toolstow failed to start:" >&2
            cat "$smoke_dir/server.log" >&2 || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:18080/ | grep -qi "<html"
          curl -fsS http://127.0.0.1:18080/ui/v1/theme.js | grep -q "ToolStow"
          echo "Smoke test passed for $ARCHIVE"

      # Windows 打包成 .zip（二进制叫 toolstow.exe）
      - name: Package binary archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/toolstow.exe" staging/
          Copy-Item README.md, LICENSE, .env.example staging/
          Compress-Archive -Path staging\* -DestinationPath "dist/toolstow-${{ github.ref_name }}-${{ matrix.name }}.zip"

      # Windows：在干净空临时目录解压并验证 --version 与单二进制内嵌前端
      - name: Smoke-test unpacked binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: dist/toolstow-${{ github.ref_name }}-${{ matrix.name }}.zip
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedVer = $env:TAG_NAME.TrimStart("v")
          $smokeDir = Join-Path ([System.IO.Path]::GetTempPath()) ("toolstow-smoke-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $proc = $null
          try {
            Expand-Archive -Path $env:ARCHIVE -DestinationPath $smokeDir -Force
            $bin = Join-Path $smokeDir "toolstow.exe"
            $verOut = (& $bin --version) -join "`n"
            Write-Host "Binary version: $verOut"
            if ($verOut -notmatch [regex]::Escape($expectedVer)) {
              throw "Expected version '$expectedVer' in '$verOut'"
            }

            $dataDir = Join-Path $smokeDir "data"
            $proc = Start-Process -FilePath $bin -WorkingDirectory $smokeDir -ArgumentList @("--host", "127.0.0.1", "--port", "18080", "--data-dir", $dataDir) -PassThru -NoNewWindow

            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) {
                throw "toolstow.exe exited prematurely with code $($proc.ExitCode)"
              }
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/" -TimeoutSec 2
                if ($r.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              throw "toolstow.exe did not become ready on http://127.0.0.1:18080/"
            }

            $rootResp = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/" -TimeoutSec 5
            if ($rootResp.StatusCode -ne 200 -or $rootResp.Content -notmatch "(?i)<html") {
              throw "Unexpected root response from toolstow.exe"
            }

            $themeJsResp = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/ui/v1/theme.js" -TimeoutSec 5
            if ($themeJsResp.StatusCode -ne 200 -or $themeJsResp.Content -notmatch "ToolStow") {
              throw "Unexpected /ui/v1/theme.js response from toolstow.exe"
            }

            Write-Host "Smoke test passed for $env:ARCHIVE"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -Recurse -Force -Path $smokeDir -ErrorAction SilentlyContinue
          }

      # 同时匹配 .tar.gz 和 .zip，漏文件时直接报错
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-bin-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # =========================================================
  # 任务 2：与 CI 共用脚本，校验并打包 2 个合集压缩包
  # （toolstow-themes.zip 与 toolstow-plugins.zip 内含单个可直接上传的 .zip）
  # =========================================================
  package-assets:
    name: Package Themes & Example Plugins
    needs: [preflight]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate and bundle themes and example plugins
        run: python3 scripts/bundle_examples.py --require-node --out-dir dist

      - name: Upload asset archives
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-zips
          path: dist/*.zip
          if-no-files-found: error

  # =========================================================
  # 任务 3：复用 Linux 静态二进制构建多架构 Docker 镜像并推送至 GHCR
  # =========================================================
  docker:
    name: Build & Push Docker Image (GHCR)
    needs: [preflight, build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Linux binary artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-bin-linux-*
          path: linux-archives
          merge-multiple: true

      - name: Stage multi-arch static binaries
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-docker/amd64 dist-docker/arm64
          tar -xzf "linux-archives/toolstow-${TAG_NAME}-linux-amd64.tar.gz" -C dist-docker/amd64 ./toolstow
          tar -xzf "linux-archives/toolstow-${TAG_NAME}-linux-arm64.tar.gz" -C dist-docker/arm64 ./toolstow
          chmod 0755 dist-docker/amd64/toolstow dist-docker/arm64/toolstow
          test -s dist-docker/amd64/toolstow
          test -s dist-docker/arm64/toolstow

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke-test Docker image (linux/amd64)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_ver="${TAG_NAME#v}"
          docker buildx build --platform linux/amd64 --target prebuilt --load -t toolstow:smoke .

          cleanup() {
            docker rm -f toolstow-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name toolstow-smoke -p 127.0.0.1:18080:8080 toolstow:smoke

          ready=0
          health_json=""
          for _ in $(seq 1 30); do
            if health_json="$(curl -fsS http://127.0.0.1:18080/healthz 2>/dev/null)"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "ERROR: toolstow container failed /healthz check:" >&2
            docker logs toolstow-smoke >&2 || true
            exit 1
          fi

          echo "Container /healthz: $health_json"
          grep -q '"status":"ok"' <<<"$health_json"
          grep -q "\"version\":\"${expected_ver}\"" <<<"$health_json"

          uid="$(docker exec toolstow-smoke id -u)"
          test "$uid" = "1000"

          curl -fsS http://127.0.0.1:18080/ | grep -qi "<html"
          curl -fsS http://127.0.0.1:18080/ui/v1/theme.js | grep -q "ToolStow"
          echo "Docker image smoke test passed."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # =========================================================
  # 任务 4：核对 6 个附件齐全 + 生成有序校验码 + 发布 GitHub Release
  # =========================================================
  release:
    name: Publish GitHub Release
    needs: [build-binaries, package-assets, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify expected release assets are complete
        working-directory: artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected=(
            "toolstow-${TAG_NAME}-linux-amd64.tar.gz"
            "toolstow-${TAG_NAME}-linux-arm64.tar.gz"
            "toolstow-${TAG_NAME}-macos-arm64.tar.gz"
            "toolstow-${TAG_NAME}-windows-amd64.zip"
            "toolstow-themes.zip"
            "toolstow-plugins.zip"
          )
          for file in "${expected[@]}"; do
            if [ ! -s "$file" ]; then
              echo "ERROR: missing or empty release asset: $file" >&2
              ls -la >&2
              exit 1
            fi
          done
          echo "All ${#expected[@]} expected release assets verified."

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: LC_ALL=C sha256sum * | sort -k2 > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ### 快速下载与安装
            - 按平台下载对应二进制压缩包（`linux-amd64` / `linux-arm64` / `macos-arm64` / `windows-amd64`），解压后直接运行即可。
            - Docker 镜像（支持 `linux/amd64` / `linux/arm64`）：`docker pull ghcr.io/pyaxy/toolstow:${{ github.ref_name }}`
            - 可选使用 `SHA256SUMS.txt` 校验文件完整性。
            - `toolstow-plugins.zip` 与 `toolstow-themes.zip` 为内置示例合集包，解压后把里面的单个 `.zip` 拖进 `/admin` 上传即可使用。
          files: artifacts/*
