<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Rakugaki Sketchbook Theme Preview">
  <defs>
    <pattern id="rk-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#c8beab" stroke-width="0.7" stroke-opacity="0.5"/>
      <circle cx="0" cy="0" r="0.8" fill="#9c917e" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Warm Sketchbook Graph Paper Background -->
  <rect width="640" height="360" fill="#fcf9f2"/>
  <rect width="640" height="360" fill="url(#rk-grid)"/>

  <!-- Hand-Drawn Topbar -->
  <rect x="0" y="0" width="640" height="44" fill="#fffdf8"/>
  <line x1="0" y1="44" x2="640" y2="44" stroke="#1f1c18" stroke-width="2"/>
  <line x1="0" y1="47" x2="640" y2="47" stroke="#1f1c18" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Brand Doodle Icon & Title -->
  <rect x="16" y="10" width="24" height="24" rx="6" fill="#fde047" stroke="#1f1c18" stroke-width="1.6"/>
  <path d="M22 28L25 27L33 19L30 16L22 24L22 28Z" fill="none" stroke="#1f1c18" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="48" y="27" fill="#1f1c18" font-family="ui-rounded, -apple-system, sans-serif" font-size="13" font-weight="800">ToolStow</text>
  <g transform="rotate(-3 128 22)">
    <rect x="112" y="13" width="38" height="16" rx="7" fill="none" stroke="#d9381e" stroke-width="1.4"/>
    <text x="118" y="24" fill="#d9381e" font-family="ui-rounded, sans-serif" font-size="9" font-weight="700">落書き</text>
  </g>

  <!-- Sketchy Search Box -->
  <rect x="184" y="12" width="242" height="22" rx="7" fill="#1f1c18"/>
  <rect x="182" y="10" width="242" height="22" rx="7" fill="#fcf9f2" stroke="#1f1c18" stroke-width="1.6"/>
  <circle cx="195" cy="21" r="4" fill="none" stroke="#6b655c" stroke-width="1.4"/>
  <line x1="198" y1="24" x2="201" y2="27" stroke="#6b655c" stroke-width="1.5" stroke-linecap="round"/>
  <text x="208" y="24" fill="#6b655c" font-family="ui-rounded, sans-serif" font-size="9.5">翻找笔记本里的工具...</text>
  <rect x="394" y="14" width="22" height="14" rx="5" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.2"/>
  <text x="398" y="24" fill="#6b655c" font-family="ui-monospace, Menlo, monospace" font-size="8.5" font-weight="700">⌘K</text>

  <!-- Theme Toggle Pill -->
  <rect x="568" y="12" width="56" height="22" rx="9" fill="#1f1c18"/>
  <rect x="566" y="10" width="56" height="22" rx="9" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.6"/>
  <text x="577" y="24" fill="#1f1c18" font-family="ui-rounded, sans-serif" font-size="9.5" font-weight="700">☾ 黑板</text>

  <!-- Notebook Hero Cover Box -->
  <rect x="28" y="62" width="588" height="58" rx="10" fill="#1f1c18"/>
  <rect x="24" y="58" width="588" height="58" rx="10" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.8"/>
  <!-- Red Notebook Margin Line -->
  <line x1="42" y1="59" x2="42" y2="115" stroke="#d9381e" stroke-opacity="0.32" stroke-width="1.6"/>
  <!-- Highlighter Stroke behind Title -->
  <rect x="52" y="79" width="84" height="8" rx="2" fill="#fde047" fill-opacity="0.72"/>
  <text x="54" y="85" fill="#1f1c18" font-family="ui-rounded, sans-serif" font-size="16" font-weight="800">ToolStow</text>
  <rect x="148" y="71" width="58" height="16" rx="7" fill="#dbeafe" stroke="#1f1c18" stroke-width="1.3"/>
  <text x="157" y="82" fill="#1d4ed8" font-family="ui-monospace, monospace" font-size="9" font-weight="700">4 个工具</text>
  <text x="54" y="104" fill="#6b655c" font-family="ui-rounded, sans-serif" font-size="9.5">手绘涂鸦笔记本 · 网格纸底纹、硬投影与黑板暗色同步</text>

  <!-- Horizontal Sticky-Tab Category Bar -->
  <g>
    <rect x="27" y="131" width="68" height="22" rx="7" fill="#1f1c18"/>
    <rect x="25" y="129" width="68" height="22" rx="7" fill="#fde047" stroke="#1f1c18" stroke-width="1.6"/>
    <text x="35" y="143" fill="#1f1c18" font-family="ui-rounded, sans-serif" font-size="9.5" font-weight="800">全部笔记 4</text>

    <rect x="103" y="132" width="52" height="21" rx="7" fill="#1f1c18"/>
    <rect x="101" y="130" width="52" height="21" rx="7" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.5"/>
    <text x="112" y="144" fill="#3e3830" font-family="ui-rounded, sans-serif" font-size="9.5" font-weight="700">运维 2</text>

    <rect x="163" y="132" width="52" height="21" rx="7" fill="#1f1c18"/>
    <rect x="161" y="130" width="52" height="21" rx="7" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.5"/>
    <text x="172" y="144" fill="#3e3830" font-family="ui-rounded, sans-serif" font-size="9.5" font-weight="700">设计 2</text>

    <!-- Tag Doodle Pills -->
    <rect x="234" y="133" width="52" height="17" rx="8" fill="#d9381e" stroke="#1f1c18" stroke-width="1.3"/>
    <text x="242" y="144" fill="#fcf9f2" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">#docker</text>

    <rect x="292" y="133" width="44" height="17" rx="8" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.3"/>
    <text x="300" y="144" fill="#3e3830" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">#svg</text>

    <rect x="342" y="133" width="50" height="17" rx="8" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.3"/>
    <text x="349" y="144" fill="#3e3830" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">#notes</text>
  </g>

  <!-- Card 1 (Tilted -0.8deg with Yellow Masking Tape) -->
  <g transform="rotate(-0.8 162 215)">
    <rect x="29" y="171" width="276" height="82" rx="10" fill="#1f1c18"/>
    <rect x="25" y="167" width="276" height="82" rx="10" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.8"/>
    <rect x="136" y="160" width="52" height="12" rx="3" fill="#fde047" fill-opacity="0.78" stroke="#1f1c18" stroke-opacity="0.35" stroke-width="1" transform="rotate(-2 162 166)"/>
    <rect x="38" y="179" width="24" height="24" rx="7" fill="#fcf9f2" stroke="#1f1c18" stroke-width="1.5"/>
    <text x="44" y="195" font-size="12">🐳</text>
    <text x="70" y="195" fill="#1f1c18" font-family="ui-rounded, sans-serif" font-size="11.5" font-weight="800">Docker 常用命令速查</text>
    <rect x="250" y="182" width="38" height="15" rx="6" fill="#fcf9f2" stroke="#1f1c18" stroke-width="1.2"/>
    <text x="255" y="192" fill="#6b655c" font-family="ui-monospace, monospace" font-size="8">v1.0.0</text>
    <text x="38" y="219" fill="#6b655c" font-family="ui-rounded, sans-serif" font-size="9">容器、镜像、Compose 与空间清理速查</text>
    <line x1="38" y1="229" x2="288" y2="229" stroke="#cdc3b3" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="38" y="242" fill="#6b655c" font-family="ui-monospace, monospace" font-size="8.5">运维 · docker-cheatsheet</text>
    <text x="252" y="242" fill="#d9381e" font-family="ui-rounded, sans-serif" font-size="9" font-weight="800">翻开 →</text>
  </g>

  <!-- Card 2 (Tilted +0.8deg with Blue Masking Tape) -->
  <g transform="rotate(0.8 472 215)">
    <rect x="339" y="171" width="276" height="82" rx="10" fill="#1f1c18"/>
    <rect x="335" y="167" width="276" height="82" rx="10" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.8"/>
    <rect x="446" y="160" width="52" height="12" rx="3" fill="#93c5fd" fill-opacity="0.72" stroke="#1f1c18" stroke-opacity="0.35" stroke-width="1" transform="rotate(2 472 166)"/>
    <rect x="348" y="179" width="24" height="24" rx="7" fill="#fcf9f2" stroke="#1f1c18" stroke-width="1.5"/>
    <text x="354" y="195" font-size="12">🎨</text>
    <text x="380" y="195" fill="#1f1c18" font-family="ui-rounded, sans-serif" font-size="11.5" font-weight="800">Dynamic Favicon</text>
    <rect x="560" y="182" width="38" height="15" rx="6" fill="#fcf9f2" stroke="#1f1c18" stroke-width="1.2"/>
    <text x="565" y="192" fill="#6b655c" font-family="ui-monospace, monospace" font-size="8">v1.2.0</text>
    <text x="348" y="219" fill="#6b655c" font-family="ui-rounded, sans-serif" font-size="9">实时生成 SVG 图标并联动手绘网格纸样式</text>
    <line x1="348" y1="229" x2="598" y2="229" stroke="#cdc3b3" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="348" y="242" fill="#6b655c" font-family="ui-monospace, monospace" font-size="8.5">设计 · dynamic-favicon</text>
    <text x="562" y="242" fill="#d9381e" font-family="ui-rounded, sans-serif" font-size="9" font-weight="800">翻开 →</text>
  </g>

  <!-- Card 3 (Sketchbook Light Note) -->
  <g transform="rotate(0.5 162 297)">
    <rect x="29" y="267" width="276" height="58" rx="10" fill="#1f1c18"/>
    <rect x="25" y="263" width="276" height="58" rx="10" fill="#fffdf8" stroke="#1f1c18" stroke-width="1.8"/>
    <rect x="136" y="257" width="50" height="11" rx="3" fill="#fca5a5" fill-opacity="0.7" stroke="#1f1c18" stroke-opacity="0.32" stroke-width="1" transform="rotate(-1.5 161 262)"/>
    <text x="40" y="287" fill="#1f1c18" font-family="ui-rounded, sans-serif" font-size="11" font-weight="800">✎ Cron Schedule Doodle</text>
    <text x="40" y="306" fill="#6b655c" font-family="ui-rounded, sans-serif" font-size="9">可视化校验定时任务与下次执行时间</text>
  </g>

  <!-- Card 4 (Chalkboard Dark Mode Swatch Preview!) -->
  <g transform="rotate(-0.6 472 297)">
    <rect x="339" y="267" width="276" height="58" rx="10" fill="#575046"/>
    <rect x="335" y="263" width="276" height="58" rx="10" fill="#171614" stroke="#f4efe6" stroke-width="1.8"/>
    <rect x="446" y="257" width="52" height="11" rx="3" fill="#fbbf24" fill-opacity="0.52" stroke="#f4efe6" stroke-opacity="0.35" stroke-width="1" transform="rotate(1.6 472 262)"/>
    <text x="350" y="287" fill="#f4efe6" font-family="ui-rounded, sans-serif" font-size="11" font-weight="800">☾ Chalkboard Dark Mode</text>
    <text x="350" y="306" fill="#a8a095" font-family="ui-rounded, sans-serif" font-size="9">黑板粉笔暗色模式 · 同步至所有插件内页</text>
    <rect x="556" y="276" width="44" height="15" rx="6" fill="#fbbf24"/>
    <text x="564" y="287" fill="#171614" font-family="ui-monospace, monospace" font-size="8" font-weight="800">CHALK</text>
  </g>

  <!-- Notebook Footer -->
  <rect x="0" y="336" width="640" height="24" fill="#fffdf8"/>
  <line x1="0" y1="336" x2="640" y2="336" stroke="#1f1c18" stroke-width="1.6"/>
  <circle cx="18" cy="348" r="3.5" fill="#d9381e" stroke="#1f1c18" stroke-width="1.2"/>
  <text x="28" y="352" fill="#6b655c" font-family="ui-monospace, Menlo, monospace" font-size="9">笔记本就绪 · 4 / 4</text>
  <text x="506" y="352" fill="#6b655c" font-family="ui-monospace, Menlo, monospace" font-size="9">Rakugaki Sketchbook</text>
</svg>
