<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker 常用命令速查</title>
  <link rel="stylesheet" href="/ui/v1/toolstow.css">
  <script src="/ui/v1/theme.js"></script>
  <style>
    .search-input {
      flex: 1;
      min-width: 220px;
    }

    .shortcut-hint {
      display: inline-flex;
      align-items: center;
      gap: var(--ts-space-1);
      font-size: 12px;
      white-space: nowrap;
    }

    .category-tabs {
      align-self: flex-start;
    }

    .cmd-group {
      margin-bottom: var(--ts-space-5);
    }

    .cmd-group:last-child {
      margin-bottom: 0;
    }

    .cmd-group-title {
      margin-bottom: var(--ts-space-2);
    }

    .cmd-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: var(--ts-space-3);
    }

    @media (max-width: 520px) {
      .cmd-grid {
        grid-template-columns: 1fr;
      }

      .shortcut-hint {
        display: none;
      }
    }

    .cmd-card {
      justify-content: space-between;
    }

    .cmd-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--ts-ink);
    }

    .cmd-note {
      margin-top: 2px;
      font-size: 12px;
      color: var(--ts-ink-muted);
    }

    .cmd-copy-btn {
      flex-shrink: 0;
    }

    .cmd-copy-btn.is-copied {
      background: var(--ts-success);
      border-color: var(--ts-success);
      color: var(--ts-code-ink);
    }
  </style>
</head>
<body>
  <div class="ts-page">
    <header class="ts-standalone-only ts-standalone-header">
      <h1>🐳 Docker 常用命令速查</h1>
    </header>

    <section class="ts-stack">
      <div class="ts-toolbar">
        <input
          id="filter-input"
          class="ts-input search-input"
          type="search"
          placeholder="输入关键词过滤（如 logs、compose、prune、exec、port）..."
          autocomplete="off"
          aria-label="过滤 Docker 命令"
        >
        <span id="match-count" class="ts-badge ts-badge-mono">0 条</span>
        <span class="ts-muted shortcut-hint">按 <kbd class="ts-kbd">/</kbd> 聚焦</span>
      </div>
      <div id="category-tabs" class="ts-tabs category-tabs" role="tablist" aria-label="命令分组"></div>
    </section>

    <main id="command-groups"></main>
  </div>

  <script>
    const COMMANDS = [
      // 容器生命周期
      {
        category: "容器管理",
        title: "查看运行中容器",
        note: "加 -a 查看包括已停止的所有容器",
        cmd: "docker ps -a",
        keywords: "list container status running",
      },
      {
        category: "容器管理",
        title: "后台启动并映射端口",
        note: "指定名称、端口映射和自动重启策略",
        cmd: "docker run -d --name app --restart unless-stopped -p 8080:80 nginx:alpine",
        keywords: "start create port detach",
      },
      {
        category: "容器管理",
        title: "一次性交互式调试容器",
        note: "退出后自动删除容器（--rm）",
        cmd: "docker run --rm -it alpine:3.20 sh",
        keywords: "shell temporary debug interactive",
      },
      {
        category: "容器管理",
        title: "进入运行中容器终端",
        note: "若镜像无 bash 可改用 sh",
        cmd: "docker exec -it <container> sh",
        keywords: "bash shell attach enter",
      },
      {
        category: "容器管理",
        title: "启动 / 停止 / 重启容器",
        note: "按容器名或 ID 控制生命周期",
        cmd: "docker restart <container>",
        keywords: "start stop reboot",
      },
      {
        category: "容器管理",
        title: "强制删除容器",
        note: "包括正在运行中的容器（谨慎使用）",
        cmd: "docker rm -f <container>",
        keywords: "remove delete force",
      },

      // 日志与排查
      {
        category: "日志与排查",
        title: "实时追踪最近日志",
        note: "只看最后 200 行并持续输出（带时间戳加 -t）",
        cmd: "docker logs -f --tail 200 <container>",
        keywords: "tail follow stdout stderr debug",
      },
      {
        category: "日志与排查",
        title: "查看容器实时资源占用",
        note: "CPU、内存、网络与磁盘 I/O 监控",
        cmd: "docker stats --no-stream",
        keywords: "cpu memory top monitor performance",
      },
      {
        category: "日志与排查",
        title: "查看容器元信息与 IP",
        note: "快速提取容器网络地址与挂载详情",
        cmd: "docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' <container>",
        keywords: "ip inspect mount env network",
      },
      {
        category: "日志与排查",
        title: "宿主机与容器互拷文件",
        note: "反向写即可从容器拷回宿主机",
        cmd: "docker cp ./config.yaml <container>:/app/config.yaml",
        keywords: "copy file transfer upload download",
      },

      // 镜像管理
      {
        category: "镜像管理",
        title: "构建镜像（指定 Dockerfile）",
        note: "当前目录作为构建上下文",
        cmd: "docker build -t myapp:latest -f Dockerfile .",
        keywords: "image tag compile",
      },
      {
        category: "镜像管理",
        title: "构建多架构镜像（Buildx）",
        note: "常用于 macOS ARM 构建 Linux amd64 镜像",
        cmd: "docker buildx build --platform linux/amd64,linux/arm64 -t user/app:v1 --push .",
        keywords: "arm64 amd64 cross platform buildx",
      },
      {
        category: "镜像管理",
        title: "导出与导入离线镜像包",
        note: "导出为 tar.gz 便于内网传输",
        cmd: "docker save myapp:latest | gzip > myapp.tar.gz && docker load -i myapp.tar.gz",
        keywords: "export import tar offline save load",
      },
      {
        category: "镜像管理",
        title: "查看本地镜像列表",
        note: "显示仓库名、标签、镜像 ID 和体积",
        cmd: "docker images",
        keywords: "image ls size list",
      },

      // Docker Compose
      {
        category: "Docker Compose",
        title: "后台启动并按需重建",
        note: "同时清理已移除的孤立服务容器",
        cmd: "docker compose up -d --build --remove-orphans",
        keywords: "start rebuild stack",
      },
      {
        category: "Docker Compose",
        title: "查看指定服务实时日志",
        note: "支持同时指定多个服务名",
        cmd: "docker compose logs -f --tail 100 <service>",
        keywords: "log tail debug service",
      },
      {
        category: "Docker Compose",
        title: "拉取最新镜像并滚动重建",
        note: "常用一键升级部署流程",
        cmd: "docker compose pull && docker compose up -d",
        keywords: "update upgrade pull deploy",
      },
      {
        category: "Docker Compose",
        title: "停止并移除编排资源",
        note: "加 -v 会一并删除命名数据卷（慎用）",
        cmd: "docker compose down",
        keywords: "stop destroy remove",
      },

      // 网络与数据卷
      {
        category: "网络与数据卷",
        title: "创建自定义桥接网络",
        note: "同网络内容器可直接通过容器名互相解析",
        cmd: "docker network create app-net",
        keywords: "bridge dns network",
      },
      {
        category: "网络与数据卷",
        title: "查看所有数据卷及挂载点",
        note: "排查持久化数据所在位置",
        cmd: "docker volume ls",
        keywords: "storage persist volume",
      },

      // 空间清理
      {
        category: "空间清理",
        title: "查看 Docker 磁盘占用详情",
        note: "镜像、容器、数据卷与构建缓存占比一目了然",
        cmd: "docker system df -v",
        keywords: "disk space usage size",
      },
      {
        category: "空间清理",
        title: "清理悬空镜像与构建缓存",
        note: "释放磁盘空间，不影响正在使用的容器与卷",
        cmd: "docker image prune -f && docker builder prune -f",
        keywords: "clean dangling cache gc free",
      },
      {
        category: "空间清理",
        title: "深度清理所有未使用资源",
        note: "清理已停止容器、未引用网络与全部未用镜像",
        cmd: "docker system prune -a",
        keywords: "clean all prune gc",
      },
    ];

    const state = {
      query: "",
      category: "全部",
    };

    const filterInput = document.getElementById("filter-input");
    const categoryTabs = document.getElementById("category-tabs");
    const commandGroups = document.getElementById("command-groups");
    const matchCount = document.getElementById("match-count");

    async function copyCommand(text, codeEl, buttonEl) {
      const ok = window.ToolStow ? await window.ToolStow.copy(text, codeEl) : false;

      if (ok) {
        const prev = buttonEl.textContent;
        buttonEl.textContent = "已复制";
        buttonEl.classList.add("is-copied");
        if (window.ToolStow) {
          window.ToolStow.toast("已复制到剪贴板");
        }
        window.setTimeout(() => {
          buttonEl.textContent = prev;
          buttonEl.classList.remove("is-copied");
        }, 1400);
      } else if (window.ToolStow) {
        window.ToolStow.toast("当前环境限制自动复制，已选中命令请按 Cmd/Ctrl+C");
      }
    }

    function getCategories() {
      const seen = new Set();
      const cats = ["全部"];
      for (const item of COMMANDS) {
        if (!seen.has(item.category)) {
          seen.add(item.category);
          cats.push(item.category);
        }
      }
      return cats;
    }

    function renderTabs() {
      const frag = document.createDocumentFragment();
      for (const cat of getCategories()) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ts-tab" + (state.category === cat ? " active" : "");
        btn.textContent = cat;
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", String(state.category === cat));
        btn.addEventListener("click", () => {
          state.category = cat;
          renderTabs();
          renderCommands();
        });
        frag.appendChild(btn);
      }
      categoryTabs.replaceChildren(frag);
    }

    function renderCommands() {
      const tokens = state.query
        .trim()
        .toLowerCase()
        .split(/\s+/)
        .filter(Boolean);

      const matched = COMMANDS.filter((item) => {
        if (state.category !== "全部" && item.category !== state.category) {
          return false;
        }
        if (tokens.length === 0) return true;
        const haystack = `${item.category} ${item.title} ${item.note} ${item.cmd} ${item.keywords}`.toLowerCase();
        return tokens.every((t) => haystack.includes(t));
      });

      matchCount.textContent = `${matched.length} 条`;

      if (matched.length === 0) {
        const empty = document.createElement("div");
        empty.className = "ts-empty";
        empty.textContent = "未找到匹配的 Docker 命令，请尝试其它关键词。";
        commandGroups.replaceChildren(empty);
        return;
      }

      const grouped = new Map();
      for (const item of matched) {
        if (!grouped.has(item.category)) grouped.set(item.category, []);
        grouped.get(item.category).push(item);
      }

      const frag = document.createDocumentFragment();
      for (const [catName, items] of grouped.entries()) {
        const section = document.createElement("section");
        section.className = "cmd-group";

        const heading = document.createElement("h2");
        heading.className = "ts-section-title cmd-group-title";
        heading.textContent = `${catName} (${items.length})`;
        section.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "cmd-grid";

        for (const item of items) {
          const card = document.createElement("article");
          card.className = "ts-card cmd-card";

          const titleWrap = document.createElement("div");
          const title = document.createElement("div");
          title.className = "cmd-title";
          title.textContent = item.title;

          const note = document.createElement("div");
          note.className = "cmd-note";
          note.textContent = item.note;

          titleWrap.append(title, note);

          const codeRow = document.createElement("div");
          codeRow.className = "ts-code-row";

          const code = document.createElement("pre");
          code.className = "ts-code";
          code.textContent = item.cmd;

          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.className = "ts-btn ts-btn-sm cmd-copy-btn";
          copyBtn.textContent = "复制";
          copyBtn.addEventListener("click", () => copyCommand(item.cmd, code, copyBtn));

          codeRow.append(code, copyBtn);
          card.append(titleWrap, codeRow);
          grid.appendChild(card);
        }

        section.appendChild(grid);
        frag.appendChild(section);
      }

      commandGroups.replaceChildren(frag);
    }

    filterInput.addEventListener("input", (e) => {
      state.query = e.target.value;
      renderCommands();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey && document.activeElement !== filterInput) {
        e.preventDefault();
        filterInput.focus();
        filterInput.select();
      } else if (e.key === "Escape" && document.activeElement === filterInput) {
        if (filterInput.value) {
          filterInput.value = "";
          state.query = "";
          renderCommands();
        } else {
          filterInput.blur();
        }
      }
    });

    renderTabs();
    renderCommands();
  </script>
</body>
</html>
