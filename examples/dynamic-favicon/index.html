<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动态强调色 Favicon 生成器</title>
  <style>
    :root {
      --accent: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
    }

    :root[data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #162033;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      color: var(--muted);
    }

    .sync-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 720px) {
      body {
        padding: 12px;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      font-size: 13px;
      font-weight: 500;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="color"] {
      width: 38px;
      height: 32px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      cursor: pointer;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hex-input {
      width: 100px !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .checkbox-label input {
      accent-color: var(--accent);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    .preview-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px;
      border-radius: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
    }

    .preview-sizes {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .preview-box {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .preview-box img {
      display: block;
    }

    .tab-mock {
      width: 100%;
      max-width: 280px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px 8px 0 0;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .tab-mock img {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .tab-mock-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .code-preview {
      margin: 0;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .status-line {
      min-height: 20px;
      font-size: 12px;
      color: var(--success);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🎨 动态强调色 Favicon 生成器</h1>
      <div class="sync-badge">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="host-theme-label">当前主站强调色：#2563eb</span>
      </div>
    </header>

    <div class="layout">
      <section class="panel" aria-label="图标配置">
        <h2>图标参数</h2>

        <div class="field">
          <label for="glyph-input">显示文字或 Emoji（建议 1–3 字符）</label>
          <input id="glyph-input" type="text" maxlength="6" value="TS" placeholder="例如 TS / ⚡ / A">
        </div>

        <div class="field">
          <div class="field-row">
            <label for="bg-color-picker">强调色（背景主色）</label>
            <label class="checkbox-label">
              <input id="follow-host" type="checkbox" checked>
              跟随主站强调色
            </label>
          </div>
          <div class="color-row">
            <input id="bg-color-picker" type="color" value="#2563eb" aria-label="选择背景强调色">
            <input id="bg-color-hex" class="hex-input" type="text" value="#2563eb" maxlength="7" aria-label="背景十六进制色值">
            <button id="resync-btn" class="btn" type="button">同步主站</button>
          </div>
        </div>

        <div class="field">
          <label for="bg-style">背景样式</label>
          <select id="bg-style">
            <option value="gradient">强调色柔和渐变</option>
            <option value="solid">纯色填充</option>
            <option value="outline">浅底描边</option>
          </select>
        </div>

        <div class="field">
          <div class="field-row">
            <label for="fg-color-picker">前景色（文字颜色）</label>
            <label class="checkbox-label">
              <input id="auto-contrast" type="checkbox" checked>
              自动高对比度
            </label>
          </div>
          <div class="color-row">
            <input id="fg-color-picker" type="color" value="#ffffff" aria-label="选择文字颜色">
            <input id="fg-color-hex" class="hex-input" type="text" value="#ffffff" maxlength="7" aria-label="文字十六进制色值">
          </div>
        </div>

        <div class="field">
          <div class="field-row">
            <label for="radius-range">圆角比例</label>
            <span id="radius-value">24%</span>
          </div>
          <input id="radius-range" type="range" min="0" max="50" value="24">
        </div>

        <div class="field">
          <div class="field-row">
            <label for="font-size-range">字号比例</label>
            <span id="font-size-value">52%</span>
          </div>
          <input id="font-size-range" type="range" min="28" max="76" value="52">
        </div>

        <div class="field">
          <label class="checkbox-label">
            <input id="bold-toggle" type="checkbox" checked>
            粗体显示
          </label>
        </div>
      </section>

      <section class="panel" aria-label="实时预览与导出">
        <h2>实时预览</h2>

        <div class="preview-stage">
          <div class="tab-mock" aria-label="浏览器标签页效果预览">
            <img id="preview-tab" alt="标签页预览">
            <span class="tab-mock-title">ToolStow — 个人微工具箱</span>
            <span aria-hidden="true">×</span>
          </div>

          <div class="preview-sizes">
            <div class="preview-item">
              <div class="preview-box"><img id="preview-128" width="128" height="128" alt="128px 预览"></div>
              <span>128×128</span>
            </div>
            <div class="preview-item">
              <div class="preview-box"><img id="preview-48" width="48" height="48" alt="48px 预览"></div>
              <span>48×48</span>
            </div>
            <div class="preview-item">
              <div class="preview-box"><img id="preview-32" width="32" height="32" alt="32px 预览"></div>
              <span>32×32</span>
            </div>
            <div class="preview-item">
              <div class="preview-box"><img id="preview-16" width="16" height="16" alt="16px 预览"></div>
              <span>16×16</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="png-size">PNG 导出分辨率</label>
          <select id="png-size">
            <option value="32">32×32（标准 Favicon）</option>
            <option value="64">64×64（高清 Favicon）</option>
            <option value="180">180×180（Apple Touch Icon）</option>
            <option value="192">192×192（Android PWA）</option>
            <option value="512" selected>512×512（高分通用）</option>
          </select>
        </div>

        <div class="btn-row">
          <button id="download-svg-btn" class="btn btn-primary" type="button">下载 SVG</button>
          <button id="download-png-btn" class="btn btn-primary" type="button">下载 PNG</button>
          <button id="copy-svg-btn" class="btn" type="button">复制 SVG 代码</button>
        </div>

        <div id="status-line" class="status-line" role="status" aria-live="polite"></div>

        <div class="field">
          <label>HTML 引用示例</label>
          <pre id="html-snippet" class="code-preview"></pre>
        </div>
      </section>
    </div>
  </div>

  <script>
    const state = {
      hostAccent: "#2563eb",
      hostMode: "light",
      followHost: true,
      glyph: "TS",
      bgColor: "#2563eb",
      bgStyle: "gradient",
      autoContrast: true,
      fgColor: "#ffffff",
      radiusPct: 24,
      fontSizePct: 52,
      bold: true,
      pngSize: 512,
      currentSvg: "",
      currentDataUrl: "",
      statusTimer: null,
    };

    const els = {
      hostThemeLabel: document.getElementById("host-theme-label"),
      glyphInput: document.getElementById("glyph-input"),
      followHost: document.getElementById("follow-host"),
      bgColorPicker: document.getElementById("bg-color-picker"),
      bgColorHex: document.getElementById("bg-color-hex"),
      resyncBtn: document.getElementById("resync-btn"),
      bgStyle: document.getElementById("bg-style"),
      autoContrast: document.getElementById("auto-contrast"),
      fgColorPicker: document.getElementById("fg-color-picker"),
      fgColorHex: document.getElementById("fg-color-hex"),
      radiusRange: document.getElementById("radius-range"),
      radiusValue: document.getElementById("radius-value"),
      fontSizeRange: document.getElementById("font-size-range"),
      fontSizeValue: document.getElementById("font-size-value"),
      boldToggle: document.getElementById("bold-toggle"),
      pngSize: document.getElementById("png-size"),
      downloadSvgBtn: document.getElementById("download-svg-btn"),
      downloadPngBtn: document.getElementById("download-png-btn"),
      copySvgBtn: document.getElementById("copy-svg-btn"),
      statusLine: document.getElementById("status-line"),
      htmlSnippet: document.getElementById("html-snippet"),
      previews: [
        document.getElementById("preview-tab"),
        document.getElementById("preview-128"),
        document.getElementById("preview-48"),
        document.getElementById("preview-32"),
        document.getElementById("preview-16"),
      ],
    };

    function isHex6(val) {
      return typeof val === "string" && /^#[0-9a-fA-F]{6}$/.test(val);
    }

    function normalizeHex(val) {
      if (typeof val !== "string") return null;
      const trimmed = val.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(trimmed)) return trimmed.toLowerCase();
      if (/^#[0-9a-fA-F]{3}$/.test(trimmed)) {
        const r = trimmed[1], g = trimmed[2], b = trimmed[3];
        return `#${r}${r}${g}${g}${b}${b}`.toLowerCase();
      }
      return null;
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    function rgbToHex(r, g, b) {
      const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
      return (
        "#" +
        [clamp(r), clamp(g), clamp(b)]
          .map((v) => v.toString(16).padStart(2, "0"))
          .join("")
      );
    }

    function shiftColor(hex, factor) {
      const { r, g, b } = hexToRgb(hex);
      return rgbToHex(r * factor, g * factor, b * factor);
    }

    function pickContrastColor(hex) {
      const { r, g, b } = hexToRgb(hex);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.62 ? "#0f172a" : "#ffffff";
    }

    function escapeXml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function buildSvg() {
      const size = 128;
      const rx = Math.round((state.radiusPct / 100) * size);
      const fontSize = Math.round((state.fontSizePct / 100) * size);
      const fontWeight = state.bold ? "700" : "500";
      const accent = state.bgColor;
      const accentDark = shiftColor(accent, 0.72);

      let textColor = state.fgColor;
      if (state.autoContrast) {
        textColor = state.bgStyle === "outline" ? accent : pickContrastColor(accent);
      }

      let defs = "";
      let bgRect = "";
      if (state.bgStyle === "gradient") {
        defs = `<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${accent}"/><stop offset="100%" stop-color="${accentDark}"/></linearGradient></defs>`;
        bgRect = `<rect width="${size}" height="${size}" rx="${rx}" fill="url(#g)"/>`;
      } else if (state.bgStyle === "outline") {
        const fill = state.hostMode === "dark" ? "#0f172a" : "#ffffff";
        bgRect = `<rect x="5" y="5" width="${size - 10}" height="${size - 10}" rx="${Math.max(0, rx - 3)}" fill="${fill}" stroke="${accent}" stroke-width="10"/>`;
      } else {
        bgRect = `<rect width="${size}" height="${size}" rx="${rx}" fill="${accent}"/>`;
      }

      const safeText = escapeXml(state.glyph.trim() || " ");
      return [
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`,
        defs,
        bgRect,
        `<text x="50%" y="52%" dominant-baseline="central" text-anchor="middle" fill="${textColor}" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="${fontSize}" font-weight="${fontWeight}">${safeText}</text>`,
        `</svg>`,
      ]
        .filter(Boolean)
        .join("");
    }

    function showStatus(msg) {
      if (state.statusTimer) window.clearTimeout(state.statusTimer);
      els.statusLine.textContent = msg;
      state.statusTimer = window.setTimeout(() => {
        els.statusLine.textContent = "";
      }, 2600);
    }

    function triggerDownload(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function render() {
      if (state.autoContrast) {
        const computed = state.bgStyle === "outline" ? state.bgColor : pickContrastColor(state.bgColor);
        state.fgColor = computed;
        els.fgColorPicker.value = computed;
        els.fgColorHex.value = computed;
      }

      els.bgColorPicker.value = state.bgColor;
      els.bgColorHex.value = state.bgColor;
      els.followHost.checked = state.followHost;
      els.fgColorPicker.disabled = state.autoContrast;
      els.fgColorHex.disabled = state.autoContrast;
      els.radiusValue.textContent = `${state.radiusPct}%`;
      els.fontSizeValue.textContent = `${state.fontSizePct}%`;
      els.hostThemeLabel.textContent = `当前主站强调色：${state.hostAccent}`;

      const svg = buildSvg();
      state.currentSvg = svg;
      const dataUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      state.currentDataUrl = dataUrl;

      for (const img of els.previews) {
        img.src = dataUrl;
      }

      els.htmlSnippet.textContent =
        `<link rel="icon" type="image/svg+xml" href="/favicon.svg">\n` +
        `<link rel="icon" type="image/png" sizes="${state.pngSize}x${state.pngSize}" href="/favicon-${state.pngSize}x${state.pngSize}.png">`;
    }

    function downloadSvg() {
      const blob = new Blob([state.currentSvg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      triggerDownload(url, "favicon.svg");
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      showStatus("已触发 favicon.svg 下载");
    }

    function downloadPng() {
      const size = Number(state.pngSize) || 512;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        showStatus("无法初始化 Canvas 渲染上下文");
        return;
      }

      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        const filename = `favicon-${size}x${size}.png`;

        if (typeof canvas.toBlob === "function") {
          canvas.toBlob((blob) => {
            if (!blob) {
              triggerDownload(canvas.toDataURL("image/png"), filename);
              showStatus(`已触发 ${filename} 下载`);
              return;
            }
            const url = URL.createObjectURL(blob);
            triggerDownload(url, filename);
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
            showStatus(`已触发 ${filename} 下载`);
          }, "image/png");
        } else {
          triggerDownload(canvas.toDataURL("image/png"), filename);
          showStatus(`已触发 ${filename} 下载`);
        }
      };
      img.onerror = () => {
        showStatus("PNG 渲染失败，请改用 SVG 导出");
      };
      img.src = state.currentDataUrl;
    }

    async function copySvgCode() {
      let ok = false;
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        try {
          await navigator.clipboard.writeText(state.currentSvg);
          ok = true;
        } catch {
          ok = false;
        }
      }
      if (!ok) {
        try {
          const ta = document.createElement("textarea");
          ta.value = state.currentSvg;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch {
          ok = false;
        }
      }
      showStatus(ok ? "SVG 代码已复制到剪贴板" : "剪贴板受限，请直接点击“下载 SVG”");
    }

    function applyHostTheme(payload) {
      if (!payload || typeof payload !== "object") return;
      if (payload.mode === "dark" || payload.mode === "light") {
        state.hostMode = payload.mode;
        document.documentElement.dataset.theme = payload.mode;
      }
      const hex = normalizeHex(payload.accent);
      if (hex) {
        state.hostAccent = hex;
        document.documentElement.style.setProperty("--accent", hex);
        if (state.followHost) {
          state.bgColor = hex;
        }
      }
      render();
    }

    // Bind controls
    els.glyphInput.addEventListener("input", (e) => {
      state.glyph = e.target.value;
      render();
    });

    els.followHost.addEventListener("change", (e) => {
      state.followHost = e.target.checked;
      if (state.followHost) {
        state.bgColor = state.hostAccent;
      }
      render();
    });

    els.bgColorPicker.addEventListener("input", (e) => {
      const hex = normalizeHex(e.target.value);
      if (!hex) return;
      state.bgColor = hex;
      state.followHost = false;
      render();
    });

    els.bgColorHex.addEventListener("input", (e) => {
      const hex = normalizeHex(e.target.value);
      if (!hex) return;
      state.bgColor = hex;
      state.followHost = false;
      render();
    });

    els.resyncBtn.addEventListener("click", () => {
      state.followHost = true;
      state.bgColor = state.hostAccent;
      render();
      showStatus(`已同步主站强调色 ${state.hostAccent}`);
    });

    els.bgStyle.addEventListener("change", (e) => {
      state.bgStyle = e.target.value;
      render();
    });

    els.autoContrast.addEventListener("change", (e) => {
      state.autoContrast = e.target.checked;
      render();
    });

    els.fgColorPicker.addEventListener("input", (e) => {
      const hex = normalizeHex(e.target.value);
      if (!hex) return;
      state.autoContrast = false;
      els.autoContrast.checked = false;
      state.fgColor = hex;
      render();
    });

    els.fgColorHex.addEventListener("input", (e) => {
      const hex = normalizeHex(e.target.value);
      if (!hex) return;
      state.autoContrast = false;
      els.autoContrast.checked = false;
      state.fgColor = hex;
      render();
    });

    els.radiusRange.addEventListener("input", (e) => {
      state.radiusPct = Number(e.target.value);
      render();
    });

    els.fontSizeRange.addEventListener("input", (e) => {
      state.fontSizePct = Number(e.target.value);
      render();
    });

    els.boldToggle.addEventListener("change", (e) => {
      state.bold = e.target.checked;
      render();
    });

    els.pngSize.addEventListener("change", (e) => {
      state.pngSize = Number(e.target.value);
      render();
    });

    els.downloadSvgBtn.addEventListener("click", downloadSvg);
    els.downloadPngBtn.addEventListener("click", downloadPng);
    els.copySvgBtn.addEventListener("click", copySvgCode);

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "toolstow:theme") {
        applyHostTheme(event.data.payload);
      }
    });

    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      state.hostMode = "dark";
      document.documentElement.dataset.theme = "dark";
    }

    render();

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "toolstow:ready" }, "*");
    }
  </script>
</body>
</html>
