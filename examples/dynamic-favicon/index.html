<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动态强调色 Favicon 生成器</title>
  <link rel="stylesheet" href="/ui/v1/toolstow.css">
  <script src="/ui/v1/theme.js"></script>
  <style>
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ts-accent);
      display: inline-block;
      flex-shrink: 0;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--ts-space-2);
      flex-wrap: wrap;
    }

    .color-picker {
      width: 38px;
      height: 34px;
      padding: 2px;
      border: 1px solid var(--ts-border);
      border-radius: var(--ts-radius-sm);
      background: var(--ts-canvas);
      cursor: pointer;
      flex-shrink: 0;
    }

    .hex-input {
      width: 108px;
      font-family: var(--ts-font-mono);
    }

    .range-input {
      width: 100%;
      accent-color: var(--ts-accent);
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--ts-ink-secondary);
    }

    .checkbox-label input {
      accent-color: var(--ts-accent);
    }

    .preview-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--ts-space-4);
      padding: var(--ts-space-5);
      border-radius: var(--ts-radius-md);
      background: var(--ts-surface-hover);
      border: 1px solid var(--ts-border);
    }

    .preview-sizes {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: var(--ts-space-4);
      flex-wrap: wrap;
    }

    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: var(--ts-font-mono);
      color: var(--ts-ink-muted);
    }

    .preview-box {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--ts-radius-sm);
    }

    .preview-box img {
      display: block;
    }

    .tab-mock {
      width: 100%;
      max-width: 280px;
      display: flex;
      align-items: center;
      gap: var(--ts-space-2);
      padding: var(--ts-space-2) var(--ts-space-3);
      border-radius: var(--ts-radius-md) var(--ts-radius-md) 0 0;
      background: var(--ts-canvas);
      border: 1px solid var(--ts-border);
      font-size: 12px;
      color: var(--ts-ink);
    }

    .tab-mock img {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .tab-mock-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="ts-page">
    <header class="ts-standalone-only ts-standalone-header">
      <h1>🎨 动态强调色 Favicon 生成器</h1>
    </header>

    <div class="ts-split">
      <section class="ts-card" aria-label="图标配置">
        <div class="ts-card-header">
          <h2 class="ts-section-title">图标参数</h2>
          <span class="ts-badge ts-badge-mono">
            <span class="sync-dot" aria-hidden="true"></span>
            <span id="host-theme-label">主站：#18181b</span>
          </span>
        </div>

        <div class="field">
          <label class="ts-label" for="glyph-input">显示文字或 Emoji（建议 1–3 字符）</label>
          <input id="glyph-input" class="ts-input" type="text" maxlength="6" value="TS" placeholder="例如 TS / ⚡ / A">
        </div>

        <div class="field">
          <div class="field-head">
            <label class="ts-label" for="bg-color-picker">强调色（背景主色）</label>
            <label class="checkbox-label">
              <input id="follow-host" type="checkbox" checked>
              跟随主站强调色
            </label>
          </div>
          <div class="ts-row">
            <input id="bg-color-picker" class="color-picker" type="color" value="#18181b" aria-label="选择背景强调色">
            <input id="bg-color-hex" class="ts-input hex-input" type="text" value="#18181b" maxlength="7" aria-label="背景十六进制色值">
            <button id="resync-btn" class="ts-btn ts-btn-sm" type="button">同步主站</button>
          </div>
        </div>

        <div class="field">
          <label class="ts-label" for="bg-style">背景样式</label>
          <select id="bg-style" class="ts-select">
            <option value="gradient">强调色柔和渐变</option>
            <option value="solid">纯色填充</option>
            <option value="outline">浅底描边</option>
          </select>
        </div>

        <div class="field">
          <div class="field-head">
            <label class="ts-label" for="fg-color-picker">前景色（文字颜色）</label>
            <label class="checkbox-label">
              <input id="auto-contrast" type="checkbox" checked>
              自动高对比度
            </label>
          </div>
          <div class="ts-row">
            <input id="fg-color-picker" class="color-picker" type="color" value="#ffffff" aria-label="选择文字颜色">
            <input id="fg-color-hex" class="ts-input hex-input" type="text" value="#ffffff" maxlength="7" aria-label="文字十六进制色值">
          </div>
        </div>

        <div class="field">
          <div class="field-head">
            <label class="ts-label" for="radius-range">圆角比例</label>
            <span id="radius-value" class="ts-badge ts-badge-mono">24%</span>
          </div>
          <input id="radius-range" class="range-input" type="range" min="0" max="50" value="24">
        </div>

        <div class="field">
          <div class="field-head">
            <label class="ts-label" for="font-size-range">字号比例</label>
            <span id="font-size-value" class="ts-badge ts-badge-mono">52%</span>
          </div>
          <input id="font-size-range" class="range-input" type="range" min="28" max="76" value="52">
        </div>

        <div class="field">
          <label class="checkbox-label">
            <input id="bold-toggle" type="checkbox" checked>
            粗体显示
          </label>
        </div>
      </section>

      <section class="ts-card" aria-label="实时预览与导出">
        <div class="ts-card-header">
          <h2 class="ts-section-title">实时预览</h2>
        </div>

        <div class="preview-stage">
          <div class="tab-mock" aria-label="浏览器标签页效果预览">
            <img id="preview-tab" alt="标签页预览">
            <span class="tab-mock-title">ToolStow — 个人微工具箱</span>
            <span class="ts-muted" aria-hidden="true">×</span>
          </div>

          <div class="preview-sizes">
            <div class="preview-item">
              <div class="preview-box"><img id="preview-128" width="128" height="128" alt="128px 预览"></div>
              <span>128×128</span>
            </div>
            <div class="preview-item">
              <div class="preview-box"><img id="preview-48" width="48" height="48" alt="48px 预览"></div>
              <span>48×48</span>
            </div>
            <div class="preview-item">
              <div class="preview-box"><img id="preview-32" width="32" height="32" alt="32px 预览"></div>
              <span>32×32</span>
            </div>
            <div class="preview-item">
              <div class="preview-box"><img id="preview-16" width="16" height="16" alt="16px 预览"></div>
              <span>16×16</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="ts-label" for="png-size">PNG 导出分辨率</label>
          <select id="png-size" class="ts-select">
            <option value="32">32×32（标准 Favicon）</option>
            <option value="64">64×64（高清 Favicon）</option>
            <option value="180">180×180（Apple Touch Icon）</option>
            <option value="192">192×192（Android PWA）</option>
            <option value="512" selected>512×512（高分通用）</option>
          </select>
        </div>

        <div class="ts-row">
          <button id="download-svg-btn" class="ts-btn ts-btn-primary" type="button">下载 SVG</button>
          <button id="download-png-btn" class="ts-btn ts-btn-primary" type="button">下载 PNG</button>
          <button id="copy-svg-btn" class="ts-btn" type="button">复制 SVG 代码</button>
        </div>

        <div class="field">
          <span class="ts-label">HTML 引用示例</span>
          <pre id="html-snippet" class="ts-code"></pre>
        </div>
      </section>
    </div>
  </div>

  <script>
    const state = {
      hostAccent: "#18181b",
      hostMode: "light",
      followHost: true,
      glyph: "TS",
      bgColor: "#18181b",
      bgStyle: "gradient",
      autoContrast: true,
      fgColor: "#ffffff",
      radiusPct: 24,
      fontSizePct: 52,
      bold: true,
      pngSize: 512,
      currentSvg: "",
      currentDataUrl: "",
    };

    const els = {
      hostThemeLabel: document.getElementById("host-theme-label"),
      glyphInput: document.getElementById("glyph-input"),
      followHost: document.getElementById("follow-host"),
      bgColorPicker: document.getElementById("bg-color-picker"),
      bgColorHex: document.getElementById("bg-color-hex"),
      resyncBtn: document.getElementById("resync-btn"),
      bgStyle: document.getElementById("bg-style"),
      autoContrast: document.getElementById("auto-contrast"),
      fgColorPicker: document.getElementById("fg-color-picker"),
      fgColorHex: document.getElementById("fg-color-hex"),
      radiusRange: document.getElementById("radius-range"),
      radiusValue: document.getElementById("radius-value"),
      fontSizeRange: document.getElementById("font-size-range"),
      fontSizeValue: document.getElementById("font-size-value"),
      boldToggle: document.getElementById("bold-toggle"),
      pngSize: document.getElementById("png-size"),
      downloadSvgBtn: document.getElementById("download-svg-btn"),
      downloadPngBtn: document.getElementById("download-png-btn"),
      copySvgBtn: document.getElementById("copy-svg-btn"),
      htmlSnippet: document.getElementById("html-snippet"),
      previews: [
        document.getElementById("preview-tab"),
        document.getElementById("preview-128"),
        document.getElementById("preview-48"),
        document.getElementById("preview-32"),
        document.getElementById("preview-16"),
      ],
    };

    function normalizeHex(val) {
      if (typeof val !== "string") return null;
      const trimmed = val.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(trimmed)) return trimmed.toLowerCase();
      if (/^#[0-9a-fA-F]{3}$/.test(trimmed)) {
        const r = trimmed[1];
        const g = trimmed[2];
        const b = trimmed[3];
        return `#${r}${r}${g}${g}${b}${b}`.toLowerCase();
      }
      return null;
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    function rgbToHex(r, g, b) {
      const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
      return (
        "#" +
        [clamp(r), clamp(g), clamp(b)]
          .map((v) => v.toString(16).padStart(2, "0"))
          .join("")
      );
    }

    function shiftColor(hex, factor) {
      const { r, g, b } = hexToRgb(hex);
      return rgbToHex(r * factor, g * factor, b * factor);
    }

    function pickContrastColor(hex) {
      const { r, g, b } = hexToRgb(hex);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.62 ? "#09090b" : "#ffffff";
    }

    function escapeXml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function buildSvg() {
      const size = 128;
      const rx = Math.round((state.radiusPct / 100) * size);
      const fontSize = Math.round((state.fontSizePct / 100) * size);
      const fontWeight = state.bold ? "700" : "500";
      const accent = state.bgColor;
      const accentDark = shiftColor(accent, 0.72);

      let textColor = state.fgColor;
      if (state.autoContrast) {
        textColor = state.bgStyle === "outline" ? accent : pickContrastColor(accent);
      }

      let defs = "";
      let bgRect = "";
      if (state.bgStyle === "gradient") {
        defs = `<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${accent}"/><stop offset="100%" stop-color="${accentDark}"/></linearGradient></defs>`;
        bgRect = `<rect width="${size}" height="${size}" rx="${rx}" fill="url(#g)"/>`;
      } else if (state.bgStyle === "outline") {
        const fill = state.hostMode === "dark" ? "#09090b" : "#ffffff";
        bgRect = `<rect x="5" y="5" width="${size - 10}" height="${size - 10}" rx="${Math.max(0, rx - 3)}" fill="${fill}" stroke="${accent}" stroke-width="10"/>`;
      } else {
        bgRect = `<rect width="${size}" height="${size}" rx="${rx}" fill="${accent}"/>`;
      }

      const safeText = escapeXml(state.glyph.trim() || " ");
      return [
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`,
        defs,
        bgRect,
        `<text x="50%" y="52%" dominant-baseline="central" text-anchor="middle" fill="${textColor}" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="${fontSize}" font-weight="${fontWeight}">${safeText}</text>`,
        `</svg>`,
      ]
        .filter(Boolean)
        .join("");
    }

    function notify(msg) {
      if (window.ToolStow) {
        window.ToolStow.toast(msg);
      }
    }

    function triggerDownload(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function render() {
      if (state.autoContrast) {
        const computed = state.bgStyle === "outline" ? state.bgColor : pickContrastColor(state.bgColor);
        state.fgColor = computed;
        els.fgColorPicker.value = computed;
        els.fgColorHex.value = computed;
      }

      els.bgColorPicker.value = state.bgColor;
      els.bgColorHex.value = state.bgColor;
      els.followHost.checked = state.followHost;
      els.fgColorPicker.disabled = state.autoContrast;
      els.fgColorHex.disabled = state.autoContrast;
      els.radiusValue.textContent = `${state.radiusPct}%`;
      els.fontSizeValue.textContent = `${state.fontSizePct}%`;
      els.hostThemeLabel.textContent = `主站：${state.hostAccent}`;

      const svg = buildSvg();
      state.currentSvg = svg;
      const dataUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      state.currentDataUrl = dataUrl;

      for (const img of els.previews) {
        img.src = dataUrl;
      }

      els.htmlSnippet.textContent =
        `<link rel="icon" type="image/svg+xml" href="/favicon.svg">\n` +
        `<link rel="icon" type="image/png" sizes="${state.pngSize}x${state.pngSize}" href="/favicon-${state.pngSize}x${state.pngSize}.png">`;
    }

    function downloadSvg() {
      const blob = new Blob([state.currentSvg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      triggerDownload(url, "favicon.svg");
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      notify("已触发 favicon.svg 下载");
    }

    function downloadPng() {
      const size = Number(state.pngSize) || 512;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        notify("无法初始化 Canvas 渲染上下文");
        return;
      }

      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        const filename = `favicon-${size}x${size}.png`;

        if (typeof canvas.toBlob === "function") {
          canvas.toBlob((blob) => {
            if (!blob) {
              triggerDownload(canvas.toDataURL("image/png"), filename);
              notify(`已触发 ${filename} 下载`);
              return;
            }
            const url = URL.createObjectURL(blob);
            triggerDownload(url, filename);
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
            notify(`已触发 ${filename} 下载`);
          }, "image/png");
        } else {
          triggerDownload(canvas.toDataURL("image/png"), filename);
          notify(`已触发 ${filename} 下载`);
        }
      };
      img.onerror = () => {
        notify("PNG 渲染失败，请改用 SVG 导出");
      };
      img.src = state.currentDataUrl;
    }

    async function copySvgCode() {
      const ok = window.ToolStow ? await window.ToolStow.copy(state.currentSvg) : false;
      notify(ok ? "SVG 代码已复制到剪贴板" : "剪贴板受限，请直接点击“下载 SVG”");
    }

    function applyHostTheme(theme) {
      if (!theme || typeof theme !== "object") return;
      if (theme.mode === "dark" || theme.mode === "light") {
        state.hostMode = theme.mode;
      }
      const hex = normalizeHex(theme.accent);
      if (hex) {
        state.hostAccent = hex;
        if (state.followHost) {
          state.bgColor = hex;
        }
      }
      render();
    }

    els.glyphInput.addEventListener("input", (e) => {
      state.glyph = e.target.value;
      render();
    });

    els.followHost.addEventListener("change", (e) => {
      state.followHost = e.target.checked;
      if (state.followHost) {
        state.bgColor = state.hostAccent;
      }
      render();
    });

    els.bgColorPicker.addEventListener("input", (e) => {
      const hex = normalizeHex(e.target.value);
      if (!hex) return;
      state.bgColor = hex;
      state.followHost = false;
      render();
    });

    els.bgColorHex.addEventListener("input", (e) => {
      const hex = normalizeHex(e.target.value);
      if (!hex) return;
      state.bgColor = hex;
      state.followHost = false;
      render();
    });

    els.resyncBtn.addEventListener("click", () => {
      state.followHost = true;
      state.bgColor = state.hostAccent;
      render();
      notify(`已同步主站强调色 ${state.hostAccent}`);
    });

    els.bgStyle.addEventListener("change", (e) => {
      state.bgStyle = e.target.value;
      render();
    });

    els.autoContrast.addEventListener("change", (e) => {
      state.autoContrast = e.target.checked;
      render();
    });

    els.fgColorPicker.addEventListener("input", (e) => {
      const hex = normalizeHex(e.target.value);
      if (!hex) return;
      state.autoContrast = false;
      els.autoContrast.checked = false;
      state.fgColor = hex;
      render();
    });

    els.fgColorHex.addEventListener("input", (e) => {
      const hex = normalizeHex(e.target.value);
      if (!hex) return;
      state.autoContrast = false;
      els.autoContrast.checked = false;
      state.fgColor = hex;
      render();
    });

    els.radiusRange.addEventListener("input", (e) => {
      state.radiusPct = Number(e.target.value);
      render();
    });

    els.fontSizeRange.addEventListener("input", (e) => {
      state.fontSizePct = Number(e.target.value);
      render();
    });

    els.boldToggle.addEventListener("change", (e) => {
      state.bold = e.target.checked;
      render();
    });

    els.pngSize.addEventListener("change", (e) => {
      state.pngSize = Number(e.target.value);
      render();
    });

    els.downloadSvgBtn.addEventListener("click", downloadSvg);
    els.downloadPngBtn.addEventListener("click", downloadPng);
    els.copySvgBtn.addEventListener("click", copySvgCode);

    if (window.ToolStow) {
      applyHostTheme(window.ToolStow.getTheme());
      window.ToolStow.onThemeChange(({ mode, accent }) => {
        applyHostTheme({ mode, accent });
      });
    } else {
      render();
    }
  </script>
</body>
</html>
