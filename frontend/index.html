<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolStow</title>
  <link rel="stylesheet" href="/ui/v1/toolstow.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <div id="status-banner" class="status-banner" role="status" aria-live="polite" hidden></div>

    <!-- Directory View (home): single topbar + searchable tool list -->
    <div id="directory-view" class="directory-view">
      <header class="topbar">
        <a href="#" id="brand-link" class="brand" aria-label="返回工具箱首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span id="brand-title">ToolStow</span>
        </a>

        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7.25" cy="7.25" r="4.75" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10.8 10.8L13.75 13.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <input
            id="search-input"
            type="search"
            placeholder="搜索工具、分类或标签..."
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索工具"
          >
          <kbd class="search-kbd" aria-hidden="true">⌘K</kbd>
        </div>

        <div class="topbar-actions">
          <button id="theme-toggle" class="btn btn-sm" type="button" aria-label="切换明暗模式">暗色</button>
          <a id="admin-link" class="btn btn-primary btn-sm" href="/admin" hidden>管理 / 设置</a>
        </div>
      </header>

      <main id="empty-state" class="empty-state">
        <div class="tool-catalog">
          <div id="active-filter-bar" class="active-filter-bar" role="region" aria-label="当前筛选条件" hidden></div>
          <ul id="empty-grid" class="tool-list" aria-label="可用工具"></ul>
        </div>
      </main>
    </div>

    <!-- Active Tool Workspace: ONE 46px bar + full-height iframe -->
    <section id="tool-view" class="tool-view" hidden>
      <header class="workspace-bar">
        <div class="wb-left">
          <button id="back-btn" class="btn btn-sm wb-back" type="button" aria-label="返回工具目录">← 目录</button>
          <select id="quick-switcher" class="quick-switcher" aria-label="快速切换工具"></select>
          <span id="active-tool-icon" class="tool-icon wb-icon" aria-hidden="true"></span>
          <h1 id="active-tool-name" class="wb-name"></h1>
          <span id="active-tool-vis-badge" class="vis-badge wb-vis-badge" hidden></span>
        </div>

        <div class="wb-right">
          <button
            id="cmd-palette-trigger"
            class="btn btn-sm wb-search-btn"
            type="button"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="cmd-palette"
            aria-label="快速搜索工具"
            title="快速搜索工具 (⌘K)"
          ><svg class="wb-search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7.25" cy="7.25" r="4.75" stroke="currentColor" stroke-width="1.4"/><path d="M10.8 10.8L13.75 13.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="btn-label">搜索</span><kbd class="wb-kbd" aria-hidden="true">⌘K</kbd></button>
          <button
            id="info-toggle"
            class="btn btn-sm"
            type="button"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="info-popover"
            aria-label="工具详情"
          ><span aria-hidden="true">ⓘ</span><span class="btn-label"> 详情</span></button>
          <button id="reload-tool-btn" class="btn btn-sm" type="button" aria-label="刷新工具"><span class="btn-glyph" aria-hidden="true">↻</span><span class="btn-label">刷新</span></button>
          <button id="tool-theme-toggle" class="btn btn-sm" type="button" aria-label="切换明暗模式">暗色</button>
        </div>

        <div id="info-popover" class="info-popover" role="dialog" aria-label="工具详情" hidden>
          <dl class="info-list">
            <div class="info-row">
              <dt>ID</dt>
              <dd><code id="active-tool-id"></code></dd>
            </div>
            <div id="info-version-row" class="info-row">
              <dt>版本</dt>
              <dd><code id="active-tool-version"></code></dd>
            </div>
            <div id="info-visibility-row" class="info-row" hidden>
              <dt>可见性</dt>
              <dd><span id="active-tool-vis-info" class="vis-badge"></span></dd>
            </div>
            <div id="info-theme-row" class="info-row" hidden>
              <dt>主题</dt>
              <dd><span id="active-tool-theme-badge" class="mono-badge mono-badge-accent">theme-sync</span></dd>
            </div>
          </dl>
          <p id="active-tool-desc" class="info-desc"></p>
          <div id="active-tool-tags" class="tag-list" role="group" aria-label="工具标签"></div>
          <a id="standalone-link" class="btn btn-sm" target="_blank" rel="noopener noreferrer" hidden>在新标签页打开 <span aria-hidden="true">↗</span></a>
        </div>
      </header>

      <div id="iframe-host" class="iframe-host"></div>
    </section>

    <!-- Command Palette / Quick Search overlay (preserves active tool iframe) -->
    <div id="cmd-palette" class="cmd-palette" role="dialog" aria-modal="true" aria-label="快速搜索工具" hidden>
      <div id="cmd-palette-backdrop" class="cmd-palette-backdrop"></div>
      <div class="cmd-palette-panel">
        <div class="cmd-palette-head">
          <svg class="cmd-palette-search-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7.25" cy="7.25" r="4.75" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10.8 10.8L13.75 13.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <input
            id="cmd-palette-input"
            type="search"
            placeholder="快速切换或搜索工具（名称、描述、标签、ID）..."
            autocomplete="off"
            spellcheck="false"
            aria-label="快速搜索工具"
            aria-controls="cmd-palette-list"
            aria-autocomplete="list"
          >
          <kbd class="cmd-palette-esc" aria-hidden="true">ESC</kbd>
        </div>
        <div id="cmd-palette-list" class="cmd-palette-list" role="listbox" aria-label="匹配工具"></div>
        <div class="cmd-palette-foot" aria-hidden="true">
          <span><kbd class="inline-kbd">↑</kbd> <kbd class="inline-kbd">↓</kbd> 选择</span>
          <span><kbd class="inline-kbd">Enter</kbd> 打开</span>
          <span><kbd class="inline-kbd">Esc</kbd> 关闭</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/ui/v1/host.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
