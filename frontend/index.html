<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolStow</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebar-toggle" class="btn icon-btn mobile-only" type="button" aria-label="切换导航栏" aria-expanded="false">☰</button>
        <a href="#" id="brand-link" class="brand">ToolStow</a>
      </div>

      <div class="search-wrap">
        <input
          id="search-input"
          type="search"
          placeholder="搜索工具（名称、描述、标签、ID）..."
          autocomplete="off"
          aria-label="搜索工具"
        >
        <kbd class="search-kbd" aria-hidden="true">⌘K</kbd>
      </div>

      <div class="topbar-actions">
        <button id="upload-trigger" class="btn btn-primary" type="button">上传 .zip</button>
        <input id="upload-input" type="file" accept=".zip,application/zip" hidden>

        <label class="accent-picker" title="选择强调色">
          <span class="sr-only">强调色</span>
          <input id="accent-input" type="color" value="#2563eb" aria-label="强调色">
        </label>

        <button id="theme-toggle" class="btn" type="button" aria-label="切换明暗模式">暗色</button>
      </div>
    </header>

    <div id="status-banner" class="status-banner" role="status" aria-live="polite" hidden></div>

    <div class="workspace">
      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

      <aside id="sidebar" class="sidebar" aria-label="工具导航">
        <section class="sidebar-section">
          <div class="section-header">
            <h2>分类</h2>
            <button id="refresh-list-btn" class="btn btn-sm" type="button" title="重新加载列表">刷新</button>
          </div>
          <ul id="category-list" class="nav-list"></ul>
        </section>

        <section class="sidebar-section">
          <div class="section-header">
            <h2>标签</h2>
            <button id="clear-filters-btn" class="btn btn-sm" type="button" hidden>重置筛选</button>
          </div>
          <div id="tag-list" class="tag-list"></div>
        </section>

        <section class="sidebar-section tools-section">
          <div class="section-header">
            <h2>工具列表</h2>
            <span id="tools-count" class="muted">0</span>
          </div>
          <ul id="tool-list" class="tool-list"></ul>
        </section>

        <section class="sidebar-section">
          <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="拖拽或点击上传 ZIP 工具包">
            拖拽 <code>.zip</code> 到此处或点击上传
          </div>
        </section>
      </aside>

      <main class="main-pane">
        <section id="empty-state" class="empty-state">
          <h1 id="empty-title">选择一个工具开始使用</h1>
          <p id="empty-desc" class="muted">
            从左侧列表选择已安装的工具，或将符合规范的 <code>.zip</code> 工具包拖入窗口上传（支持同 ID 覆盖更新）。
          </p>
          <div class="empty-actions">
            <button id="empty-upload-btn" class="btn btn-primary" type="button">上传 .zip 工具包</button>
          </div>
        </section>

        <section id="tool-view" class="tool-view" hidden>
          <div class="tool-toolbar">
            <div class="tool-meta">
              <span id="active-tool-icon" class="tool-icon"></span>
              <div class="tool-meta-text">
                <div class="tool-title-row">
                  <h1 id="active-tool-name"></h1>
                  <span id="active-tool-version" class="badge"></span>
                  <span id="active-tool-theme-badge" class="badge badge-accent" hidden>主题同步</span>
                </div>
                <p id="active-tool-desc" class="muted"></p>
              </div>
            </div>

            <div class="tool-actions">
              <button id="reload-tool-btn" class="btn" type="button">刷新</button>
              <a id="standalone-link" class="btn" href="#" target="_blank" rel="noopener noreferrer">独立打开</a>
              <button id="delete-tool-btn" class="btn btn-danger" type="button">删除</button>
            </div>
          </div>

          <div id="active-tool-tags" class="active-tags"></div>
          <div id="iframe-host" class="iframe-host"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-overlay-box">松开以上传 <code>.zip</code> 工具包</div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
