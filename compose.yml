services:
  toolstow:
    image: ghcr.io/pyaxy/toolstow:latest
    # 本地从源码构建试跑时可取消下一行注释，然后运行 `docker compose up -d --build`
    # build: .
    container_name: toolstow
    restart: unless-stopped
    ports:
      # 默认仅绑定宿主机回环地址（配合 Caddy / Nginx 反代）；局域网或 NAS 直连可改为 "8080:8080"
      - "127.0.0.1:8080:8080"
    environment:
      TOOLSTOW_HOST: 0.0.0.0
      TOOLSTOW_PORT: 8080
      TOOLSTOW_DATA_DIR: /data
      TOOLSTOW_COOKIE_SECURE: ${TOOLSTOW_COOKIE_SECURE:-false}
      TOOLSTOW_INCLUDE_DRAFTS: ${TOOLSTOW_INCLUDE_DRAFTS:-false}
      TOOLSTOW_MAX_UPLOAD_MB: ${TOOLSTOW_MAX_UPLOAD_MB:-50}
      # 建议在同目录 .env 中配置以下两把独立随机密钥（openssl rand -hex 32）
      TOOLSTOW_ADMIN_KEY: ${TOOLSTOW_ADMIN_KEY:-}
      TOOLSTOW_API_KEY: ${TOOLSTOW_API_KEY:-}
    volumes:
      - toolstow_data:/data
      # 如需改为宿主机目录挂载，请先执行: mkdir -p data && chown -R 1000:1000 data
      # - ./data:/data

volumes:
  toolstow_data:
    name: toolstow_data
